<div id="modal" hidden></div>
<div id="toast" hidden></div>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const inr=n=>'₹'+r2(n).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:2});
const pad=(n,l)=>String(n).padStart(l,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2);
const today=()=>dstr(new Date());
const pd=s=>{const [y,m,d]=String(s).slice(0,10).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return dstr(d)};
const addBiz=(s,n)=>{const d=pd(s);let k=0;while(k<n){d.setDate(d.getDate()+1);const w=d.getDay();if(w!==0&&w!==6)k++}return dstr(d)};
const diffDays=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const fmtD=s=>{if(!s)return '—';const d=pd(s);return pad(d.getDate(),2)+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+' '+d.getFullYear()};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone=o=>JSON.parse(JSON.stringify(o));
const fyOf=s=>{const d=pd(s);const y=d.getMonth()>=3?d.getFullYear():d.getFullYear()-1;return y};
const fyStart=s=>fyOf(s)+'-04-01';
const fyTag=s=>{const y=fyOf(s);return pad(y%100,2)+pad((y+1)%100,2)};
const digits=s=>String(s||'').replace(/\D/g,'').slice(-10);

/* ---------- constants & defaults ---------- */
const CATS=['Interior designer','Architect','Builder','Developer','Contractor (civil/electrical/MEP)','Electrical dealer','Kitchen / furniture showroom','Society / real-estate app','Other'];
const STAGES=['New','Registered','Presales','Site visit','Estimate sent','Negotiation','Won','Lost'];
const PTYPES=['Villa','Apartment','Multi-unit project','Office','Retrofit / renovation','Other'];
const ICATS=['Smart Touch Interfaces','Smart Relay & Sensing','Smart Glide','Locks & Entry','Services'];
const DEF={company:'IOTIQ',address:"6th Floor, Pardha's Picasa, Durgam Cheruvu Road, Kavuri Hills, Madhapur, Hyderabad, Telangana - 500081",gstin:'',phone:'8121234162',email:'gowtham.k@iotiq.co.in',
 protectDays:90,clawbackDays:90,tdsPct:2,tdsThreshold:20000,ackHours:48,estimateDays:5,validDays:15,dueDays:15,defaultGst:18,terms:'Quote valid for the period shown. Prices exclude site civil, wiring and back-box work unless listed. Payment: as agreed in the order confirmation.'};
const DEFTIERS=[{n:1,name:'Registered',fee:8,min:0,payoutDays:15},{n:2,name:'Preferred',fee:10,min:1000000,payoutDays:12},{n:3,name:'Elite',fee:12,min:3000000,payoutDays:10},{n:4,name:'Strategic',fee:15,min:10000000,payoutDays:7}];
const COLS=['cps','leads','items','estimates','invoices','payments','payouts','b2c_docs','settings'];
const S={};COLS.forEach(c=>S[c]=[]);
const UI={view:'dashboard',cp:null,q:'',stage:'',cpf:'',pf:'',report:'funnel',loaded:0};
let db=null,dl=null,canW=true,booted=false;
try{const v=localStorage.getItem('iotiq_erp_view');if(v)UI.view=v}catch(e){}

const cfg=()=>Object.assign({},DEF,(S.settings.find(x=>x.id==='main')||{}));
const tiers=()=>{const t=S.settings.find(x=>x.id==='tiers');const l=(t&&t.list&&t.list.length?t.list:DEFTIERS).slice().sort((a,b)=>a.n-b.n);return l};
const tierBy=n=>tiers().find(t=>t.n===+n)||tiers()[0];
const tierForRev=rev=>{let r=tiers()[0];tiers().forEach(t=>{if(rev>=t.min)r=t});return r};
const byId=(arr,id)=>arr.find(x=>x.id===id);
const cpOf=id=>byId(S.cps,id);
const cpName=id=>(cpOf(id)||{}).name||'—';
const leadOf=id=>byId(S.leads,id);

/* ---------- db access ---------- */
const put=(c,o)=>db.collection(c).doc(o.id).set(JSON.parse(JSON.stringify(o)));
const del=(c,id)=>db.collection(c).doc(id).delete();
function subscribe(c){
  db.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(d=>Object.assign({},d.data(),{id:d.id}));UI.loaded++;sched()},
    err=>{console.warn('db',c,err&&err.code);UI.loaded++;sched()});
}

/* ---------- domain logic ---------- */
function totals(lines,disc,key){
  let sub=0,tax=0;(lines||[]).forEach(l=>{const a=(+l.qty||0)*(+l[key]||0);sub+=a;tax+=a*(1-(+disc||0)/100)*(+l.gst||0)/100});
  const d=sub*(+disc||0)/100;const taxable=sub-d;
  return {sub:r2(sub),disc:r2(d),taxable:r2(taxable),tax:r2(tax),total:r2(taxable+tax)};
}
const pays=inv=>S.payments.filter(p=>p.invoiceId===inv.id);
const paidOf=inv=>r2(pays(inv).reduce((a,p)=>a+(+p.amount||0),0));
function invStatus(inv){
  if(inv.status==='cancelled')return {t:'Cancelled',c:''};
  const paid=paidOf(inv),tot=inv.cpT.total;
  if(paid>=tot-0.5)return {t:'Paid',c:'good'};
  const od=inv.dueDate&&inv.dueDate<today();
  if(paid>0)return {t:od?'Partly paid · overdue':'Partly paid',c:od?'bad':'warn'};
  return od?{t:'Overdue',c:'bad'}:{t:'Unpaid',c:'info'};
}
const cpRev=(cpId,since)=>r2(S.payments.filter(p=>p.cpId===cpId&&(!since||p.date>=since)).reduce((a,p)=>a+(+p.net||0),0));
const cpRev12=cpId=>cpRev(cpId,addDays(today(),-365));
const cpTier=cp=>tierBy(cp.tier||1);
function nextNo(prefix,list,field,date){
  const tag=prefix+'-'+fyTag(date||today())+'-';let max=0;
  list.forEach(x=>{const n=String(x[field]||'');if(n.startsWith(tag)){const k=parseInt(n.slice(tag.length),10);if(k>max)max=k}});
  return tag+pad(max+1,4);
}
function leadSla(l){
  const c=cfg();const nowMs=Date.now();let ackBreach=false,ackHrs=null,estBreach=false,estDays=null;
  if(l.ackAt){ackHrs=Math.round((l.ackAt-l.createdAt)/36e5);ackBreach=ackHrs>c.ackHours}
  else if(!['Won','Lost'].includes(l.stage)){ackHrs=Math.round((nowMs-l.createdAt)/36e5);ackBreach=ackHrs>c.ackHours}
  const est=S.estimates.filter(e=>e.leadId===l.id).sort((a,b)=>a.date<b.date?-1:1)[0];
  if(l.ackAt){const ackD=dstr(new Date(l.ackAt));
    if(est){estDays=diffDays(est.date,ackD);estBreach=estDays>c.estimateDays}
    else if(!['Won','Lost'].includes(l.stage)){estDays=diffDays(today(),ackD);estBreach=estDays>c.estimateDays}}
  return {ackBreach,ackHrs,estBreach,estDays,hasEst:!!est};
}
function alerts(){
  const out=[];const t=today();
  S.leads.filter(l=>!['Won','Lost'].includes(l.stage)).forEach(l=>{
    const s=leadSla(l);
    if(!l.ackAt&&s.ackBreach)out.push({lvl:'bad',text:`Lead “${l.client}” (${cpName(l.cpId)}) not acknowledged within ${cfg().ackHours} h`,go:'leads'});
    if(l.ackAt&&!s.hasEst&&s.estBreach)out.push({lvl:'bad',text:`No estimate yet for “${l.client}”: ${s.estDays} days since acknowledgement (target ${cfg().estimateDays})`,go:'leads'});
    if(l.protectedUntil){const left=diffDays(l.protectedUntil,t);if(left>=0&&left<=15)out.push({lvl:'warn',text:`Protection for “${l.client}” ends in ${left} day(s)`,go:'leads'});}
  });
  S.estimates.filter(e=>e.status==='sent'&&e.validTill&&e.validTill<t).forEach(e=>out.push({lvl:'warn',text:`Estimate ${e.no} expired on ${fmtD(e.validTill)}`,go:'estimates'}));
  S.invoices.filter(i=>i.status!=='cancelled'&&invStatus(i).c==='bad').forEach(i=>out.push({lvl:'bad',text:`Invoice ${i.no} overdue: ${inr(i.cpT.total-paidOf(i))} outstanding`,go:'invoices'}));
  S.payouts.filter(p=>p.status!=='paid'&&p.dueOn&&p.dueOn<t&&p.fee>0).forEach(p=>out.push({lvl:'bad',text:`Payout to ${cpName(p.cpId)} of ${inr(p.fee)} was due ${fmtD(p.dueOn)}`,go:'payouts'}));
  S.cps.filter(c=>c.status==='Active'&&c.slaStatus!=='Signed').forEach(c=>out.push({lvl:'warn',text:`${c.name} is active but the partner agreement is not signed`,go:'partners'}));
  return out;
}
/* tier review: upgrades immediately, downgrades after one grace quarter, one tier at a time */
function reviewCp(cp){
  const cur=cp.tier||1;const target=cp.programme?4:tierForRev(cpRev12(cp.id)).n;
  if(target>cur)return {cp,from:cur,to:target,action:'upgrade'};
  if(target<cur){return cp.grace?{cp,from:cur,to:cur-1,action:'downgrade'}:{cp,from:cur,to:cur,action:'grace'}}
  return {cp,from:cur,to:cur,action:cp.grace?'recovered':'none'};
}
function tdsFor(cp,fee){
  const c=cfg();if(fee<=0)return 0;
  const prev=S.payouts.filter(p=>p.cpId===cp.id&&p.status==='paid'&&p.paidOn>=fyStart(today())).reduce((a,p)=>a+p.fee,0);
  let base=0;if(prev>=c.tdsThreshold)base=fee;else if(prev+fee>c.tdsThreshold)base=prev+fee;
  return r2(base*c.tdsPct/100);
}

/* ---------- save estimate / invoice, with the internal B2C twin ---------- */
async function saveDoc(kind,doc){
  doc.cpT=totals(doc.lines,doc.discount,'rate');
  doc.b2cT=totals(doc.lines,doc.discount,'b2cRate');
  doc.updatedAt=Date.now();
  await put(kind,doc);
  const twin={id:'b2c_'+doc.id,type:kind==='estimates'?'estimate':'invoice',parentId:doc.id,parentNo:doc.no,no:'INT-'+doc.no,
    cpId:doc.cpId,leadId:doc.leadId,date:doc.date,discount:doc.discount,igst:doc.igst,
    lines:doc.lines.map(l=>({name:l.b2cName,cpName:l.name,hsn:l.hsn,unit:l.unit,qty:l.qty,rate:l.b2cRate,gst:l.gst})),
    t:doc.b2cT,cpT:doc.cpT,uplift:r2(doc.b2cT.taxable-doc.cpT.taxable),updatedAt:Date.now()};
  await put('b2c_docs',twin);
}

/* ---------- UI plumbing ---------- */
let rq=0;function sched(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;render()})}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3200)}
function openModal(html,cls){const m=$('#modal');m.innerHTML=`<div class="mback" data-act="closeModal"></div><div class="mbox ${cls||''}" role="dialog" aria-modal="true">${html}</div>`;m.hidden=false}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';ED=null}
function ask(msg,fn,label){
  openModal(`<header><h3>Please confirm</h3><button class="x" data-act="closeModal">×</button></header><div class="body">${msg}</div><footer><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" id="askok">${label||'Confirm'}</button></footer>`);
  $('#askok').onclick=async()=>{try{await fn();closeModal()}catch(e){toast(e.message||'Failed')}};
}
function form(o){
  const h=o.fields.map(f=>{
    if(f.t==='sec')return `<h4 class="fsec">${f.l}</h4>`;
    const v=(o.values&&o.values[f.k]!=null)?o.values[f.k]:(f.d!=null?f.d:'');const id='f_'+f.k;let inp;
    if(f.t==='select')inp=`<select id="${id}">${f.o.map(x=>{const a=Array.isArray(x)?x:[x,x];return `<option value="${esc(a[0])}" ${String(v)===String(a[0])?'selected':''}>${esc(a[1])}</option>`}).join('')}</select>`;
    else if(f.t==='area')inp=`<textarea id="${id}" rows="${f.rows||3}">${esc(v)}</textarea>`;
    else if(f.t==='check')inp=`<label class="chk"><input type="checkbox" id="${id}" ${v?'checked':''}> ${f.cl||''}</label>`;
    else inp=`<input id="${id}" type="${f.t||'text'}" value="${esc(v)}" ${f.step?`step="${f.step}"`:''} ${f.ph?`placeholder="${esc(f.ph)}"`:''}>`;
    return `<div class="fld ${f.w||''}">${f.t==='check'?'':`<label for="${id}">${f.l}</label>`}${inp}${f.help?`<small>${f.help}</small>`:''}</div>`;
  }).join('');
  openModal(`<header><h3>${o.title}</h3><button class="x" data-act="closeModal" aria-label="Close">×</button></header><div class="fgrid">${h}</div><div id="ferr" class="err"></div><footer><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" id="fsave">${o.submit||'Save'}</button></footer>`,o.wide?'wide':'');
  $('#fsave').onclick=async()=>{
    const v={};o.fields.forEach(f=>{if(f.t==='sec')return;const el=$('#f_'+f.k);v[f.k]=f.t==='check'?el.checked:f.t==='number'?(el.value===''?null:parseFloat(el.value)):el.value.trim()});
    try{$('#fsave').disabled=true;const r=await o.save(v);if(r!==false)closeModal();else $('#fsave').disabled=false}
    catch(e){$('#ferr').textContent=e.message||String(e);$('#fsave').disabled=false}
  };
}
const pill=(t,c)=>`<span class="pill ${c||''}">${esc(t)}</span>`;
function tbl(cols,rows,empty){
  if(!rows.length)return `<div class="scroll"><div class="empty">${empty||'Nothing here yet.'}</div></div>`;
  return `<div class="scroll"><table class="tbl"><thead><tr>${cols.map(c=>`<th class="${c.r?'r':''}">${c.h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((x,i)=>`<td class="${cols[i]&&cols[i].r?'r':''}">${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const btn=(act,id,label,cls)=>`<button class="btn sm ${cls||''}" data-act="${act}" data-id="${esc(id||'')}">${label}</button>`;
const lnk=(act,id,label)=>`<button class="lnk" data-act="${act}" data-id="${esc(id||'')}">${esc(label)}</button>`;
function download(name,data,label){
  if(!dl){toast('Downloads are not available in this view');return}
  dl.save({filename:name,data}).then(()=>toast((label||'File')+' saved')).catch(e=>{if(e&&e.code!=='declined')toast('Could not save: '+(e.message||e.code))});
}
function csv(cols,rows){
  const q=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return [cols.map(q).join(',')].concat(rows.map(r=>r.map(q).join(','))).join('\n');
}
function parseCsv(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;else if(ch===','){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x!==''))rows.push(row);row=[]}
    else cur+=ch}
  if(cur!==''||row.length){row.push(cur);if(row.some(x=>x!==''))rows.push(row)}
  return rows;
}

/* ---------- views ---------- */
const NAV=[['dashboard','Dashboard'],['grp','Funnel'],['partners','Partners'],['leads','Leads'],['grp','Sales'],['estimates','Estimates'],['invoices','Invoices'],['payments','Payments'],['payouts','Partner payouts'],['grp','Master'],['items','Item & price sheet'],['reports','Reports'],['settings','Settings']];
function shell(body){
  const al=alerts().length;
  return `<div class="shell ${canW?'':'ro'}"><nav class="rail" aria-label="Main"><div class="brand">IOTIQ<small>Partner ERP</small></div>${NAV.map(n=>n[0]==='grp'?`<div class="grp">${n[1]}</div>`:`<button data-act="nav" data-id="${n[0]}" class="${UI.view===n[0]?'on':''}">${n[1]}${n[0]==='dashboard'&&al?`<span class="badge">${al}</span>`:''}</button>`).join('')}<div class="foot">Internal use only.<br>Partner copies never show B2C names or prices.</div></nav><main>${body}</main></div>`;
}
function head(title,sub,acts){return `<div class="top"><div><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div><div class="acts">${acts||''}</div></div>`}

function vDash(){
  const t=today(),c=cfg();
  const active=S.cps.filter(x=>x.status==='Active').length;
  const open=S.leads.filter(l=>!['Won','Lost'].includes(l.stage));
  const pipeline=open.reduce((a,l)=>a+(+l.budget||0),0);
  const invs=S.invoices.filter(i=>i.status!=='cancelled');
  const fy0=fyStart(t);
  const invFY=invs.filter(i=>i.date>=fy0).reduce((a,i)=>a+i.cpT.taxable,0);
  const recv=invs.reduce((a,i)=>a+Math.max(0,i.cpT.total-paidOf(i)),0);
  const collFY=S.payments.filter(p=>p.date>=fy0).reduce((a,p)=>a+(+p.net||0),0);
  const owed=S.payouts.filter(p=>p.status!=='paid').reduce((a,p)=>a+p.fee,0);
  const uplift=S.b2c_docs.filter(d=>d.type==='invoice'&&d.date>=fy0).reduce((a,d)=>a+(+d.uplift||0),0);
  const funnel=STAGES.map(s=>({s,n:S.leads.filter(l=>l.stage===s).length,v:S.leads.filter(l=>l.stage===s).reduce((a,l)=>a+(+l.budget||0),0)}));
  const mx=Math.max(1,...funnel.map(f=>f.n));
  const al=alerts();
  const top=S.cps.map(cp=>({cp,rev:cpRev12(cp.id)})).sort((a,b)=>b.rev-a.rev).slice(0,5);
  const dist=tiers().map(tt=>({tt,n:S.cps.filter(x=>(x.tier||1)===tt.n&&x.status!=='Inactive').length}));
  return head('Dashboard',`Financial year ${fyOf(t)}-${String(fyOf(t)+1).slice(2)} · ${fmtD(t)}`,`<button class="btn primary w" data-act="newLead">+ Lead</button><button class="btn w" data-act="newEst">+ Estimate</button><button class="btn w" data-act="newCp">+ Partner</button>`)+
  `<div class="tiles">
    <div class="tile"><div class="k">Active partners</div><div class="v">${active}</div><div class="s">${S.cps.length} on record</div></div>
    <div class="tile"><div class="k">Open leads</div><div class="v">${open.length}</div><div class="s">${inr(pipeline)} budget</div></div>
    <div class="tile"><div class="k">Invoiced (FY, ex-GST)</div><div class="v">${inr(invFY)}</div><div class="s">partner price</div></div>
    <div class="tile"><div class="k">Collected (FY, ex-GST)</div><div class="v">${inr(collFY)}</div><div class="s">basis for tiers</div></div>
    <div class="tile"><div class="k">Receivables</div><div class="v">${inr(recv)}</div><div class="s">incl. GST</div></div>
    <div class="tile"><div class="k">Partner fees unpaid</div><div class="v">${inr(owed)}</div><div class="s">accrued + due</div></div>
    <div class="tile"><div class="k">Discount vs B2C list</div><div class="v">${inr(uplift)}</div><div class="s">FY, from internal copies</div></div>
  </div>
  <div class="cols">
   <div class="card"><h3>Lead funnel</h3>${funnel.map(f=>`<div class="bar"><span>${f.s}</span><div><i style="width:${Math.round(f.n/mx*100)}%"></i></div><span>${f.n}</span></div>`).join('')}
     <p class="small muted">Won ${funnel[6].n} of ${S.leads.length} leads${S.leads.length?` (${Math.round(funnel[6].n/S.leads.length*100)}%)`:''}.</p></div>
   <div class="card"><h3>Needs attention ${al.length?pill(al.length,'bad'):''}</h3>${al.length?al.slice(0,9).map(a=>`<div class="alert">${pill(a.lvl==='bad'?'Late':'Watch',a.lvl)}<span>${esc(a.text)}</span></div>`).join('')+(al.length>9?`<p class="small muted">and ${al.length-9} more</p>`:''):'<div class="empty">All SLA clocks, invoices and payouts are on track.</div>'}</div>

  const open=S.invoices.filter(i=>i.status!=='cancelled');if(!open.length){toast('Create an invoice first');return}
  const inv0=byId(S.invoices,invId)||open[0];
  form({title:'Record payment',values:{invoiceId:inv0.id,date:today(),amount:Math.max(0,r2(inv0.cpT.total-paidOf(inv0))),mode:'UPI'},fields:[
   {k:'invoiceId',l:'Invoice',t:'select',o:open.map(i=>[i.id,`${i.no} · ${cpName(i.cpId)} · balance ${inr(i.cpT.total-paidOf(i))}`]),w:'w2'},
   {k:'date',l:'Received on',t:'date'},{k:'amount',l:'Amount received (₹, incl. GST)',t:'number',step:'any'},{k:'mode',l:'Mode',t:'select',o:['UPI','NEFT / RTGS','Cheque','Cash','Card']},{k:'ref',l:'Reference / UTR'},
   {k:'refund',t:'check',cl:'This is a refund / cancellation (reverses fee within the clawback window)',w:'w2'}],
   save:async v=>{
    const inv=byId(S.invoices,v.invoiceId);if(!inv)throw new Error('Choose an invoice.');
    let amt=Math.abs(+v.amount||0);if(!amt)throw new Error('Enter the amount.');if(v.refund)amt=-amt;
    if(!v.date)throw new Error('Enter the date.');
    const cp=cpOf(inv.cpId)||{};const net=r2(amt*(inv.cpT.taxable/inv.cpT.total));
    const pay={id:'pay_'+uid(),invoiceId:inv.id,cpId:inv.cpId,leadId:inv.leadId,date:v.date,amount:amt,net,mode:v.mode,ref:v.ref,createdAt:Date.now()};
    await put('payments',pay);
    let msg='Payment recorded';
    const fee=r2(net*(inv.feePct||0)/100);
    if(inv.cpId&&fee!==0){
      const first=pays(inv).filter(p=>p.amount>0).sort((a,b)=>a.date<b.date?1:-1).pop();
      const inWindow=!v.refund||(first&&diffDays(v.date,first.date)<=cfg().clawbackDays);
      if(inWindow){
        const tt=cpTier(cp);
        await put('payouts',{id:'po_'+pay.id,paymentId:pay.id,cpId:inv.cpId,invoiceId:inv.id,base:net,pct:inv.feePct,fee,accruedOn:v.date,dueOn:fee<0?v.date:addBiz(v.date,tt.payoutDays),status:'accrued',createdAt:Date.now()});
        msg+=fee<0?`. Clawback of ${inr(-fee)} created`:`. Fee ${inr(fee)} due ${fmtD(addBiz(v.date,tt.payoutDays))}`;
      }else msg+='. Refund is outside the clawback window, so no fee reversal';
      if(!v.refund&&cp.id&&!cp.programme){const rev=cpRev12(cp.id)+net,tg=tierForRev(rev);if(tg.n>(cp.tier||1)){await put('cps',Object.assign({},cp,{tier:tg.n,grace:false}));msg+=`. ${cp.name} upgraded to ${tg.name}`}}
    }
    toast(msg);
  }});
}
function payoutForm(id){
  const p=byId(S.payouts,id),cp=cpOf(p.cpId)||{};
  const missing=[];if(!cp.pan)missing.push('PAN');if(!cp.bankAcct)missing.push('bank account');
  if(missing.length&&p.fee>0){openModal(`<header><h3>Cannot pay yet</h3><button class="x" data-act="closeModal">×</button></header><div class="body"><p>${esc(cp.name)} has no ${missing.join(' or ')} on record. Collect and save these on the partner profile before the first payout.</p></div><footer><button class="btn primary" data-act="closeModal">OK</button></footer>`);return}
  const tds=tdsFor(cp,p.fee);
  form({title:'Mark payout paid',values:{paidOn:today(),tds},fields:[
   {k:'paidOn',l:'Paid on',t:'date'},{k:'utr',l:'UTR / reference'},{k:'tds',l:'TDS deducted (₹)',t:'number',step:'any',help:`Suggested at ${cfg().tdsPct}% once the FY total passes ${inr(cfg().tdsThreshold)}. Verify with your CA.`}],
   save:async v=>{const t=+v.tds||0;await put('payouts',Object.assign({},p,{status:'paid',paidOn:v.paidOn,utr:v.utr,tds:t,net:r2(p.fee-t)}));toast('Payout marked paid')}});
}

 newEst(el){const l=el&&el.dataset&&el.dataset.id?leadOf(el.dataset.id):null;if(!S.items.length){toast('Add items first');return}openEditor('estimates',seedDoc('estimates',l))},
 newInv(){if(!S.items.length){toast('Add items first');return}openEditor('invoices',seedDoc('invoices',null))},
 viewDoc(el){openDoc(el.dataset.id)},
 docMode(el){openDoc(el.dataset.id,el.dataset.val)},
 editDoc(el){const [k,id]=el.dataset.id.split(':');const d=byId(k==='e'?S.estimates:S.invoices,id);if(!d)return;const e=clone(d);e.isNew=false;openEditor(k==='e'?'estimates':'invoices',e)},
 delDoc(el){const [k,id]=el.dataset.id.split(':');const d=byId(S.estimates,id);ask(`Delete estimate ${esc(d.no)} and its internal B2C copy?`,async()=>{await del('estimates',id);await del('b2c_docs','b2c_'+id)},'Delete')},
 async estStatus(el){const e=byId(S.estimates,el.dataset.id),s=el.dataset.val;const o=Object.assign({},e,{status:s});if(s==='sent')o.sentOn=today();await put('estimates',o);
   const l=leadOf(e.leadId);if(l){let st=l.stage;if(s==='sent'&&STAGES.indexOf(st)<4)st='Estimate sent';if(s==='accepted')st='Won';if(s==='rejected'&&st!=='Won')st='Lost';if(st!==l.stage)await put('leads',Object.assign({},l,{stage:st}))}
   toast('Estimate '+s);openDoc('e:'+e.id)},
 toInv(el){const e=byId(S.estimates,el.dataset.id);closeModal();openEditor('invoices',seedDoc('invoices',leadOf(e.leadId),e))},
 cancelInv(el){const i=byId(S.invoices,el.dataset.id);ask(`Cancel invoice ${esc(i.no)}?`,async()=>{await put('invoices',Object.assign({},i,{status:'cancelled'}))},'Cancel invoice')},
 dlDoc(el){const [k,id]=el.dataset.id.split(':');const d=byId(k==='e'?S.estimates:S.invoices,id);const mode=el.dataset.val;
   download(`${mode==='int'?'INTERNAL-':''}${d.no}.html`,`<!doctype html><meta charset="utf-8"><title>${esc(d.no)}</title><style>${DOC_CSS}</style>${docHtml(d,k,mode)}`,'Document')},
 addLine(){ED.lines.push(blankLine());$('#e_lines').innerHTML=edLines()},
 rmLine(el){ED.lines.splice(+el.dataset.id,1);if(!ED.lines.length)ED.lines.push(blankLine());$('#e_lines').innerHTML=edLines();$('#e_tot').innerHTML=edTot()},
 recPay(el){recPayForm(el&&el.dataset?el.dataset.id:'')},
 delPay(el){const p=byId(S.payments,el.dataset.id);const po=byId(S.payouts,'po_'+p.id);
   if(po&&po.status==='paid'){toast('Its fee was already paid out. Reverse that first.');return}
   ask(`Delete this ${inr(p.amount)} payment${po?' and its accrued fee':''}?`,async()=>{await del('payments',p.id);if(po)await del('payouts',po.id)},'Delete')},
 payPayout(el){payoutForm(el.dataset.id)},
 newItem(){itemForm()},editItem(el){itemForm(byId(S.items,el.dataset.id))},
 delItem(el){const i=byId(S.items,el.dataset.id);ask(`Delete item ${esc(i.sku)}? Existing documents keep their copied lines.`,()=>del('items',i.id),'Delete')},
 impItems(){$('#impfile').click()},
 expItems(){const cols=['sku','category','b2c_name','cp_name','cp_alternatives (| separated)','hsn','gst_percent','unit','b2c_price','cp_price','cost'];download('iotiq-item-sheet.csv',csv(cols,S.items.map(i=>[i.sku,i.category,i.b2cName,i.cpName,(i.aliases||[]).join('|'),i.hsn,i.gst,i.unit,i.b2cPrice,i.cpPrice,i.cost||''])),'Item sheet')},
 tplItems(){download('iotiq-item-template.csv',csv(['sku','category','b2c_name','cp_name','cp_alternatives (| separated)','hsn','gst_percent','unit','b2c_price','cp_price','cost'],[['SW-4M','Switching','4-module smart touch panel','4-gang capacitive control module','Quad-channel touch controller|4-gang capacitive control module|Four-circuit tactile switching unit','8536','18','nos','6500','5200','']]),'Template')},
 tierOne(el){tierReview([cpOf(el.dataset.id)])},tierAll(){tierReview(S.cps.filter(c=>c.status!=='Inactive'))},
 stmt(el){const cp=cpOf(el.dataset.id);download(`fee-statement-${cp.name.replace(/\W+/g,'-')}.csv`,csv(['Invoice','Net base','Rate %','Fee','Due','Status','Paid on','TDS','Net paid','UTR'],S.payouts.filter(p=>p.cpId===cp.id).map(p=>[(byId(S.invoices,p.invoiceId)||{}).no,p.base,p.pct,p.fee,p.dueOn,p.status,p.paidOn||'',p.tds||'',p.net||'',p.utr||''])),'Statement')},
 repCsv(){const R=REPORTS[UI.report],d=R.f();download(`iotiq-${UI.report}.csv`,csv(d.cols,d.rows),'Report')},
 async saveSettings(){
  const g=k=>document.getElementById('s_'+k).value.trim();const o={id:'main'};
  ['company','gstin','phone','email','address','terms'].forEach(k=>o[k]=g(k));
  ['protectDays','clawbackDays','tdsPct','tdsThreshold','ackHours','estimateDays','validDays','dueDays','defaultGst'].forEach(k=>o[k]=+g(k)||0);
  const list=tiers().map(t=>({n:t.n,name:document.getElementById('t_name'+t.n).value.trim()||t.name,fee:+document.getElementById('t_fee'+t.n).value||0,min:+document.getElementById('t_min'+t.n).value||0,payoutDays:+document.getElementById('t_days'+t.n).value||0}));
  try{await put('settings',o);await put('settings',{id:'tiers',list});toast('Settings saved')}catch(e){toast('Could not save: '+(e.message||e.code))}},
 backup(){download('iotiq-erp-backup-'+today()+'.json',JSON.stringify(window.__store),'Backup')},
 restore(){$('#bkfile').click()},
 clearSamples(){ask('Delete all sample partners and leads?',async()=>{for(const c of S.cps.filter(x=>x.sample))await del('cps',c.id);for(const l of S.leads.filter(x=>x.sample))await del('leads',l.id)},'Delete samples')}
};
function tierReview(cps){
  const rs=cps.map(reviewCp);const ch=rs.filter(r=>r.action!=='none');
  const lbl={upgrade:'Upgrade',downgrade:'Step down',grace:'Below threshold: grace quarter starts',recovered:'Back above threshold: grace cleared'};
  openModal(`<header><h3>Tier review</h3><button class="x" data-act="closeModal">×</button></header><div class="body">${ch.length?tbl([{h:'Partner'},{h:'Paid revenue 12 m',r:1},{h:'Current'},{h:'Result'}],ch.map(r=>[esc(r.cp.name),inr(cpRev12(r.cp.id)),esc(tierBy(r.from).name),esc(lbl[r.action])+(r.to!==r.from?` → <b>${esc(tierBy(r.to).name)}</b>`:'')])):'<div class="empty">No tier changes. Every partner is on the right tier.</div>'}<p class="small muted">Upgrades apply to the next lead. Downgrades step one tier at a time, after one grace quarter. Fee rates already locked on registered leads do not change.</p></div><footer><button class="btn" data-act="closeModal">Close</button>${ch.length?'<button class="btn primary" id="tierok">Apply changes</button>':''}</footer>`);
  const ok=$('#tierok');if(ok)ok.onclick=async()=>{for(const r of ch){const o=Object.assign({},r.cp);if(r.action==='upgrade'){o.tier=r.to;o.grace=false}else if(r.action==='downgrade'){o.tier=r.to;o.grace=false}else if(r.action==='grace')o.grace=true;else o.grace=false;o.lastReview=today();await put('cps',o)}toast('Tier review applied');closeModal()};
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(el&&ACT[el.dataset.act]){if(!canW&&el.classList.contains('w'))return;ACT[el.dataset.act](el);return}
  const c=e.target.closest('[data-change]');
  if(c&&c.tagName==='BUTTON'){const k=c.dataset.change;if(k==='pf'){UI.pf=c.dataset.val;render()}if(k==='report'){UI.report=c.dataset.val;render()}}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='impfile'&&t.files[0]){importItems(t.files[0]);t.value='';return}
  if(t.id==='bkfile'&&t.files[0]){try{const j=JSON.parse(await t.files[0].text());let n=0;for(const col of COLS){for(const id of Object.keys(j[col]||{})){await put(col,Object.assign({},j[col][id],{id}));n++}}toast('Restored '+n+' records')}catch(err){toast('That file is not a valid backup')}t.value='';return}
  const ch=t.dataset&&t.dataset.change;
  if(ch==='stage'){const l=leadOf(t.dataset.id);try{await put('leads',Object.assign({},l,{stage:t.value}))}catch(err){toast('Could not update stage')}return}
  if(ch==='fstage'){UI.stage=t.value;render();return}
  if(ch==='fcp'){UI.cpf=t.value;render();return}
  if(ED&&t.id&&t.id.startsWith('e_')){
    if(t.id==='e_lead'){const l=leadOf(t.value);ED.leadId=t.value;ED.cpId=l?l.cpId:'';if(l){const cp=cpOf(l.cpId);ED.feePct=ED.billTo==='partner'?0:(l.lockedFeePct!=null?l.lockedFeePct:cpTier(cp||{}).fee);const f=$('#e_fee');if(f)f.value=ED.feePct}}
    if(t.id==='e_date')ED.date=t.value;
    if(t.id==='e_due'){if(ED.kind==='estimates')ED.validTill=t.value;else ED.dueDate=t.value}
    if(t.id==='e_igst'){ED.igst=t.value==='1';$('#e_tot').innerHTML=edTot()}
    if(t.id==='e_bill'){ED.billTo=t.value;const l=leadOf(ED.leadId);ED.feePct=t.value==='partner'?0:(l&&l.lockedFeePct!=null?l.lockedFeePct:cpTier(cpOf(ED.cpId)||{}).fee);$('#e_fee').value=ED.feePct}
    if(t.id==='e_fee')ED.feePct=+t.value||0;
    if(t.id==='e_notes')ED.notes=t.value;
    return;
  }
  if(ED&&t.dataset&&t.dataset.lf==='item'){
    const i=+t.dataset.li,it=byId(S.items,t.value);
    if(it){Object.assign(ED.lines[i],{itemId:it.id,name:it.cpName||it.b2cName,b2cName:it.b2cName,hsn:it.hsn||'',unit:it.unit||'nos',rate:+it.cpPrice||0,b2cRate:+it.b2cPrice||0,gst:it.gst!=null?+it.gst:cfg().defaultGst})}
    else ED.lines[i]=blankLine();
    $('#e_lines').innerHTML=edLines();$('#e_tot').innerHTML=edTot();$('#e_miss').innerHTML=edMiss();
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){UI.q=t.value;render();return}
  if(ED&&t.id==='e_disc'){ED.discount=+t.value||0;$('#e_tot').innerHTML=edTot();return}

    const a=document.getElementById('amt'+i);if(a)a.textContent=inr(ED.lines[i].qty*ED.lines[i].rate);$('#e_tot').innerHTML=edTot();
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});

async function importItems(file){
  try{
    const rows=parseCsv(await file.text());if(rows.length<2)throw new Error('The file has no data rows.');
    const h=rows[0].map(x=>x.trim().toLowerCase());const ix=n=>h.findIndex(x=>x.startsWith(n));
    const c={sku:ix('sku'),cat:ix('category'),b2c:ix('b2c_name'),cp:ix('cp_name'),al:ix('cp_alt'),hsn:ix('hsn'),gst:ix('gst'),unit:ix('unit'),bp:ix('b2c_price'),cpp:ix('cp_price'),cost:ix('cost')};
    if(c.sku<0||c.b2c<0||c.cp<0)throw new Error('Columns sku, b2c_name and cp_name are required. Download the template to see the layout.');
    let n=0,skip=0;
    for(const r of rows.slice(1)){
      const sku=(r[c.sku]||'').trim();if(!sku||!(r[c.b2c]||'').trim()){skip++;continue}
      const ex=S.items.find(x=>x.sku.toLowerCase()===sku.toLowerCase());
      const o=Object.assign({},ex||{},{id:ex?ex.id:'it_'+uid(),sku,category:(r[c.cat]||'Other').trim(),b2cName:r[c.b2c].trim(),cpName:(r[c.cp]||'').trim(),aliases:c.al>=0?(r[c.al]||'').split('|').map(s=>s.trim()).filter(Boolean):(ex?ex.aliases:[]),hsn:c.hsn>=0?(r[c.hsn]||'').trim():'',gst:c.gst>=0?+r[c.gst]||0:18,unit:c.unit>=0?(r[c.unit]||'nos').trim():'nos',b2cPrice:+r[c.bp]||0,cpPrice:+r[c.cpp]||0,cost:c.cost>=0?+r[c.cost]||0:0,placeholder:false});
      if(!o.cpName){skip++;continue}
      await put('items',o);n++;
    }
    toast(`Imported ${n} item(s)${skip?`, skipped ${skip} (missing SKU, B2C name or partner name)`:''}`);
  }catch(e){toast(e.message||'Import failed')}
}

/* ---------- boot ---------- */
(async function boot(){
  try{
    const cl=window.claude;
    if(cl&&cl.use){
      db=await cl.use('db');
      try{const u=await cl.use('user');if(u&&u.can){const v=await u.can('data.write');canW=v!==false}}catch(e){}
      try{dl=await cl.use('downloads')}catch(e){}
    }
  }catch(e){console.warn(e)}
  booted=true;
  if(!db){render();return}
  COLS.forEach(subscribe);render();
})();
})();
