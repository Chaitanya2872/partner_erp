# Shared configuration. Profile files: application-dev.yml (local), application-prd.yml (production).
# Every secret comes from the environment; nothing secret is stored in these files.
spring:
  application:
    name: partner-erp
    version: 0.1.0
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/partner_erp}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: partner-erp-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
  jackson:
    time-zone: Asia/Kolkata
  servlet:
    multipart:
      max-file-size: 1MB          # product CSV import (ProductImportService.MAX_BYTES)
      max-request-size: 2MB
  mvc:
    problemdetails:
      enabled: false              # GlobalExceptionHandler produces the envelope
  threads:
    virtual:
      enabled: false              # Java 17 runtime

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  security:
    jwt:
      secret: ${JWT_SECRET:}      # at least 32 bytes; startup fails without it
      issuer: partner-erp
      access-token-ttl: 15m
    refresh-token:
      ttl: 7d
      cookie-name: iotiq_rt
      cookie-path: /api/v1/auth
      cookie-secure: ${REFRESH_COOKIE_SECURE:true}
      cookie-same-site: Strict
    login:
      max-failed-attempts: 5
      lockout-duration: 15m
    password:
      min-length: 12
      max-length: 128
  bootstrap:
    super-admin:                  # used only while no Super Admin exists; see server/README.md
      email: ${BOOTSTRAP_SUPERADMIN_EMAIL:}
      password: ${BOOTSTRAP_SUPERADMIN_PASSWORD:}
      full-name: ${BOOTSTRAP_SUPERADMIN_NAME:Super Admin}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: IOTIQ Partner ERP
    version: ${spring.application.version}
    java: ${java.specification.version}

logging:
  level:
    root: INFO
    com.iotiq.partnererp: INFO
