# Production. All values are supplied by the environment (see prd/ in Phase 15). No defaults for secrets.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    clean-disabled: true

app:
  cors:
    allowed-origins: ${CORS_ORIGINS}
  security:
    jwt:
      secret: ${JWT_SECRET}
    refresh-token:
      cookie-secure: true

management:
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  structured:
    format:
      console: ecs                # JSON log lines; MDC requestId is included
  level:
    com.iotiq.partnererp: INFO
