# Integration-test profile. Uses a dedicated local database (partner_erp_test), never the dev one.
# The password is read from the environment or the git-ignored server/.env, like the dev profile.
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/partner_erp_test}
    username: ${TEST_DB_USERNAME:${DB_USERNAME:postgres}}
    password: ${TEST_DB_PASSWORD:${DB_PASSWORD}}
    hikari:
      maximum-pool-size: 4
  flyway:
    clean-disabled: false         # CleanMigrateTestConfig rebuilds the schema once per test run

app:
  security:
    jwt:
      secret: test-${random.uuid}-${random.uuid}
    refresh-token:
      cookie-secure: false
  bootstrap:
    super-admin:
      email: ""
      password: ""

logging:
  level:
    root: WARN
    com.iotiq.partnererp: INFO
